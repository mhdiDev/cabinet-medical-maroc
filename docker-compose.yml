# Compose de production (VPS OVH)
# Les secrets viennent du fichier .env à la racine (jamais commité) — voir .env.production.example
# Seuls frontend (:3000), backend (:3001) et MinIO (:9000) sont exposés, et uniquement sur 127.0.0.1 :
# Nginx (sur le host) est le seul point d'entrée public.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cabinet_postgres
    environment:
      POSTGRES_DB: cabinet_medical
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cabinet_net
    restart: unless-stopped

  minio:
    # minio/minio n'existe plus sur Docker Hub : image officielle publiée sur quay.io
    image: quay.io/minio/minio:latest
    container_name: cabinet_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER manquant dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant dans .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      # L'image minio n'embarque plus curl : on utilise le client mc inclus
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - cabinet_net
    restart: unless-stopped

  # Crée le bucket au premier démarrage et le rend lisible publiquement
  # (les documents patients sont servis par Nginx sous /files/)
  minio-init:
    # Même image que minio : elle embarque le client mc
    image: quay.io/minio/minio:latest
    container_name: cabinet_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
             mc mb --ignore-existing local/cabinet-medical &&
             mc anonymous set download local/cabinet-medical"
    networks:
      - cabinet_net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cabinet_mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - cabinet_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cabinet_backend
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/cabinet_medical?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET manquant dans .env}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN manquant dans .env}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: cabinet-medical
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?MINIO_PUBLIC_URL manquant dans .env}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      EMAIL_FROM: cabinet@example.ma
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - cabinet_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Intégrée au build Next.js : changer l'IP impose un rebuild
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL manquant dans .env}
    container_name: cabinet_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - cabinet_net
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  cabinet_net:
    driver: bridge
