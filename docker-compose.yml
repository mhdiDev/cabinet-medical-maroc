# Compose de production (VPS OVH)
# Les secrets viennent du fichier .env à la racine (jamais commité) — voir .env.production.example
# Seuls frontend (:3000), backend (:3001) et MinIO (:9000) sont exposés, et uniquement sur 127.0.0.1 :
# Nginx (sur le host) est le seul point d'entrée public.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cabinet_postgres
    environment:
      POSTGRES_DB: cabinet_medical
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cabinet_net
    restart: unless-stopped

  minio:
    # Image construite depuis le code source (voir minio/Dockerfile)
    build:
      context: ./minio
    image: cabinet-minio:local
    container_name: cabinet_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER manquant dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD manquant dans .env}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - cabinet_net
    restart: unless-stopped

  # Crée le bucket au premier démarrage et rend ses fichiers lisibles publiquement
  # (lecture seule, sans listing ; les documents patients sont servis par Nginx sous /files/)
  minio-init:
    image: amazon/aws-cli:2.31.0
    container_name: cabinet_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./minio/public-read-policy.json:/policy.json:ro
    entrypoint: >
      /bin/sh -c "(aws --endpoint-url http://minio:9000 s3api head-bucket --bucket cabinet-medical ||
                   aws --endpoint-url http://minio:9000 s3 mb s3://cabinet-medical) &&
                  aws --endpoint-url http://minio:9000 s3api put-bucket-policy --bucket cabinet-medical --policy file:///policy.json"
    networks:
      - cabinet_net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cabinet_mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - cabinet_net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cabinet_backend
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/cabinet_medical?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET manquant dans .env}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN manquant dans .env}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_REGION: us-east-1
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: cabinet-medical
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?MINIO_PUBLIC_URL manquant dans .env}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      EMAIL_FROM: cabinet@example.ma
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - cabinet_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Intégrée au build Next.js : changer l'IP impose un rebuild
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL manquant dans .env}
    container_name: cabinet_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - cabinet_net
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:

networks:
  cabinet_net:
    driver: bridge
